version: "3"

tasks:
  clean:
    desc: Clean cached data
    cmds:
      - go clean -cache
  dev:
    desc: Run SchemaBridge in dev mode
    cmds:
      - go run ./client/cli {{.CLI_ARGS}}

  build:
    desc: Build SchemaBridge
    cmds:
      - go build -o schemabridge ./client/cli

  test:
    desc: Run tests
    cmds:
      - go test -v ./...

  run:
    desc: Run SchemaBridge CLI
    cmds:
      - ./schemabridge {{.CLI_ARGS}}

  tidy:
    desc: Tidy Go dependencies
    cmds:
      - go mod tidy

  test:unit:
    desc: Run unit tests
    cmds:
      - go test -v ./tests/unit/...

  test:integration:
    desc: Run integration tests
    cmds:
      - go test -v ./tests/integration/...

  test:e2e:
    desc: Run end-to-end tests
    cmds:
      - go test -v ./tests/e2e/...

  test:perf:
    desc: Run performance tests
    cmds:
      - go test -v ./tests/perftest/...
