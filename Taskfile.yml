version: "3"

tasks:
  dev:
    desc: Run SchemaBridge in development mode
    cmds:
      - go run ./client/cli {{.CLI_ARGS}}

  build:
    desc: Build SchemaBridge CLI
    cmds:
      - go build -o schemabridge ./client/cli

  run:
    desc: Run SchemaBridge CLI
    cmds:
      - ./schemabridge {{.CLI_ARGS}}

  format:
    desc: Format Go source files
    cmds:
      - gofmt -w .

  format:check:
    desc: Check Go formatting
    cmds:
      - test -z "$(gofmt -l .)"

  vet:
    desc: Run Go static analysis
    cmds:
      - go vet ./...

  test:
    desc: Run all tests
    cmds:
      - go test -v ./...

  test:unit:
    desc: Run unit tests, optionally for a package
    vars:
      PACKAGE: "{{.CLI_ARGS}}"
    cmds:
      - go test -v ./tests/unit/{{if .PACKAGE}}{{.PACKAGE}}/...{{else}}...{{end}}

  check:
    desc: Run all quality checks
    cmds:
      - task format:check
      - task vet
      - task test

  tidy:
    desc: Tidy Go dependencies
    cmds:
      - go mod tidy

  clean:
    desc: Remove Go build and test caches
    cmds:
      - go clean -cache -testcache

  checkpoint:
    desc: Format, validate, and create a Git commit
    cmds:
      - bash ./scripts/checkpoint.sh
